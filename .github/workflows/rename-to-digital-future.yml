name: Sync digital-future branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-branding:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update internal page branding
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('about.html'), Path('ecosystem.html'), Path('explore.html')]
          replacements = {
              'digital-horizons.ai': 'digital-future.ai',
              'Digital Horizons': 'digital-future.ai',
              'NEXORA Horizons': 'digital-future.ai',
              'DIGITAL HORIZONS': 'DIGITAL FUTURE',
              'digital-horizons': 'digital-future',
              'أى.ديجيتال - هورايزونز': 'digital-future.ai',
          }

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html ecosystem.html explore.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply digital-future.ai branding [skip ci]"
          git push
